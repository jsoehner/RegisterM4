name: Publish Docker Images (Docker Hub)

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dockerhub-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: ./apps/api/Dockerfile
            image_suffix: registerm4-api
          - name: web
            dockerfile: ./apps/web/Dockerfile
            image_suffix: registerm4-web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Docker Hub secrets are set
        id: secrets
        run: |
          if test -n "${{ secrets.DOCKERHUB_USERNAME }}" && test -n "${{ secrets.DOCKERHUB_TOKEN }}"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets are not set. Skipping publish."
          fi

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [[ -f "${{ matrix.dockerfile }}" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.secrets.outputs.available == 'true' && steps.dockerfile.outputs.exists == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: steps.secrets.outputs.available == 'true' && steps.dockerfile.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push image
        if: steps.secrets.outputs.available == 'true' && steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Skip notice (missing Dockerfile)
        if: steps.dockerfile.outputs.exists != 'true'
        run: |
          echo "Skipping ${{ matrix.name }} image publish because Dockerfile is missing at ${{ matrix.dockerfile }}"

      - name: Skip notice (missing secrets)
        if: steps.secrets.outputs.available != 'true'
        run: |
          echo "Skipping ${{ matrix.name }} image publish because Docker Hub credentials are not configured."
