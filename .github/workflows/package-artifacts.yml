name: Package Artifacts

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            archive: api-dist.tar.gz
            working_directory: apps/api
            inputs: dist package.json
          - name: worker
            archive: worker-dist.tar.gz
            working_directory: apps/worker
            inputs: dist package.json
          - name: shared
            archive: shared-dist.tar.gz
            working_directory: packages/shared
            inputs: dist package.json
          - name: web
            archive: web-build.tar.gz
            working_directory: apps/web
            inputs: .next package.json next.config.js

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build --workspaces --if-present

      - name: Archive workspace package
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
          WORKING_DIR: ${{ matrix.working_directory }}
          INPUT_FILES: ${{ matrix.inputs }}
        run: |
          mkdir -p out
          tar -czf "out/${ARCHIVE_NAME}" -C "${WORKING_DIR}" ${INPUT_FILES}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registerm4-${{ matrix.name }}
          path: out/${{ matrix.archive }}
          if-no-files-found: error
