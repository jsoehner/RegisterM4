name: Package Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build --workspaces --if-present

      - name: Create release archives
        run: |
          mkdir -p out
          tar -czf out/api-dist.tar.gz -C apps/api dist package.json
          tar -czf out/worker-dist.tar.gz -C apps/worker dist package.json
          tar -czf out/shared-dist.tar.gz -C packages/shared dist package.json
          tar -czf out/web-build.tar.gz -C apps/web .next package.json next.config.js

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.1
        with:
          files: |
            out/api-dist.tar.gz
            out/worker-dist.tar.gz
            out/shared-dist.tar.gz
            out/web-build.tar.gz
          generate_release_notes: true
