name: Docker Images

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker-images.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to GHCR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: ./apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: ./apps/web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image repository
        id: image
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER}/registerm4-${{ matrix.name }}"
          REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO_LOWER" >> "$GITHUB_OUTPUT"

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [[ -f "${{ matrix.dockerfile }}" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.dockerfile.outputs.exists == 'true' && (github.event_name != 'pull_request') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.push_images == true))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.dockerfile.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and optionally push image
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ (github.event_name != 'pull_request') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.push_images == true)) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Skip notice (missing Dockerfile)
        if: steps.dockerfile.outputs.exists != 'true'
        run: |
          echo "Skipping ${{ matrix.name }} image build because Dockerfile is missing at ${{ matrix.dockerfile }}"
